<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Our Wedding Website</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Google Fonts matching your app variables -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

        <!-- Do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                /* Your Palette */
                --bg: #faf7f3;
                --surface: #ffffff;
                --surface-hover: #f5ede3;
                --heading: #2c2820;
                --text: #4a4035;
                --muted: #8a7d70;
                --accent: #7a8c5e;
                --accent-dark: #5e6e47;
                --border: #e2d9ce;

                /* Your Typography */
                --font-script: 'Great Vibes', cursive;
                --font-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
                --font-sans: 'Lato', system-ui, -apple-system, sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            html, body {
                height: 100%;
                margin: 0;
                font-family: var(--font-sans);
                background-color: var(--bg);
                color: var(--text);
                -webkit-font-smoothing: antialiased;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                width: 2.5rem;
                height: 2.5rem;
                border: 3px solid var(--border);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spinner 0.8s linear infinite;
            }

            @keyframes spinner {
                to { transform: rotate(360deg); }
            }

            .staticrypt-content {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 440px;
            }

            .staticrypt-form {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 48px 36px;
                box-shadow: 0 10px 30px rgba(44, 40, 32, 0.05);
                text-align: center;
            }

            .wedding-script-accents {
                font-family: var(--font-script);
                font-size: 2.2rem;
                color: var(--accent);
                margin-bottom: 4px;
                line-height: 1;
            }

            .staticrypt-instructions {
                margin-bottom: 28px;
            }

            .staticrypt-title {
                font-family: var(--font-display);
                font-size: 2rem;
                font-weight: 500;
                letter-spacing: 0.02em;
                margin: 0 0 10px 0;
                color: var(--heading);
            }

            .staticrypt-instructions p:not(.staticrypt-title) {
                font-size: 0.95rem;
                color: var(--muted);
                line-height: 1.5;
                margin: 0;
            }

            .staticrypt-password-container {
                position: relative;
                margin-bottom: 20px;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 14px 42px 14px 16px;
                font-family: var(--font-sans);
                font-size: 0.95rem;
                color: var(--heading);
                outline: none;
                transition: border-color 0.2s, box-shadow 0.2s;
            }

            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(122, 140, 94, 0.2);
            }

            .staticrypt-toggle-password-visibility {
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                opacity: 0.6;
                transition: opacity 0.2s;
                width: 20px;
                height: 20px;
                color: var(--muted);
            }

            .staticrypt-toggle-password-visibility:hover {
                opacity: 1;
                color: var(--heading);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                font-size: 0.875rem;
                color: var(--text);
                margin-bottom: 24px;
                cursor: pointer;
                user-select: none;
            }

            .staticrypt-remember input[type="checkbox"] {
                accent-color: var(--accent);
                width: 15px;
                height: 15px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                width: 100%;
                background: var(--accent);
                color: var(--surface);
                border: none;
                border-radius: 6px;
                padding: 14px;
                font-family: var(--font-sans);
                font-size: 0.9rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                cursor: pointer;
                transition: background-color 0.2s, transform 0.1s;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover {
                background: var(--accent-dark);
            }

            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: scale(0.99);
            }

            .hidden {
                display: none !important;
            }
        </style>
    </head>

    <body>
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

                                <!-- Open eye icon (visible password, hidden by default) -->

                        </div>

                            <input id="staticrypt-remember" type="checkbox" name="remember" />
                            Remember me on this device
                        </label>

                        <input type="submit" class="staticrypt-decrypt-button" value="Enter Website" />
                    </form>
                </div>
            </div>

                        passwordInput.setAttribute("type", "password");
                        iconSlash.classList.remove("hidden");
                        iconEye.classList.add("hidden");
                    }
                });
            }

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                const password = passwordInput.value;
                const remember = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, remember);

                if (!isSuccessful) {
                    alert(templateError || "Incorrect password, please try again.");
                }
            });
        </script>
    </body>
</html>
