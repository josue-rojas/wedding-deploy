            :root {

                --bg: #faf7f3;
                --surface: #ffffff;
                --surface-hover: #f5ede3;
                --heading: #2c2820;
                --text: #4a4035;
                --muted: #8a7d70;
                --accent: #7a8c5e;

                --border: #e2d9ce;

            * {

            html, body {
                height: 100%;

                background-color: var(--bg);
                color: var(--text);

                align-items: center;
                justify-content: center;
            }

                width: 2.5rem;
                height: 2.5rem;
                border: 3px solid var(--border);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spinner 0.8s linear infinite;
            }

            @keyframes spinner {
                to { transform: rotate(360deg); }
            }

            .staticrypt-content {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 440px;
            }

            .staticrypt-form {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 48px 36px;
                box-shadow: 0 10px 30px rgba(44, 40, 32, 0.05);
                text-align: center;
            }

            .wedding-script-accents {
                font-family: var(--font-script);
                font-size: 2.2rem;
                color: var(--accent);
                margin-bottom: 4px;
                line-height: 1;
            }

            .staticrypt-instructions {
                margin-bottom: 28px;
            }

            .staticrypt-title {
                font-family: var(--font-display);
                font-size: 2rem;
                font-weight: 500;
                letter-spacing: 0.02em;
                margin: 0 0 10px 0;
                color: var(--heading);
            }

            .staticrypt-instructions p:not(.staticrypt-title) {
                font-size: 0.95rem;
                color: var(--muted);
                line-height: 1.5;
                margin: 0;
            }

            .staticrypt-password-container {
                position: relative;
                margin-bottom: 20px;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 14px 42px 14px 16px;
                font-family: var(--font-sans);
                font-size: 0.95rem;
                color: var(--heading);
                outline: none;
                transition: border-color 0.2s, box-shadow 0.2s;
            }

            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(122, 140, 94, 0.2);
            }

            .staticrypt-toggle-password-visibility {
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                opacity: 0.6;
                transition: opacity 0.2s;
                width: 20px;
                height: 20px;
                color: var(--muted);
            }

            .staticrypt-toggle-password-visibility:hover {
                opacity: 1;
                color: var(--heading);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                font-size: 0.875rem;
                color: var(--text);
                margin-bottom: 24px;
                cursor: pointer;
                user-select: none;
            }

            .staticrypt-remember input[type="checkbox"] {
                accent-color: var(--accent);
                width: 15px;
                height: 15px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                width: 100%;
                background: var(--accent);
                color: var(--surface);
                border: none;
                border-radius: 6px;
                padding: 14px;
                font-family: var(--font-sans);
                font-size: 0.9rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                cursor: pointer;
                transition: background-color 0.2s, transform 0.1s;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover {
                background: var(--accent-dark);
            }

            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: scale(0.99);
            }

            .hidden {
                display: none !important;
            }
        </style>
    </head>

                        </div>

                            Remember me on this device

                        <input type="submit" class="staticrypt-decrypt-button" value="Enter Website" />
                    </form>
                </div>
            </div>
        </div>
